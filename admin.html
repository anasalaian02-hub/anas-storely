<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anas Store - Admin</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:#1f1f1f;
    padding:30px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00c853;
    color:white;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="login-box">
<h2>🔐 لوحة الإدارة</h2>

<input type="password" id="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<p id="msg"></p>

</div>

<script>
function login(){

if(document.getElementById("password").value==="Anas123"){

window.location.href="dashboard.html";

}else{

document.getElementById("msg").innerHTML="❌ كلمة المرور غير صحيحة";

}

}
</script>

</body>
</html>
