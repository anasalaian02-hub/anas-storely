<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | Anas Store</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:#161b22;
border:1px solid #30363d;
border-radius:18px;
padding:35px;
box-shadow:0 0 25px rgba(0,255,255,.15);
}

.logo{
font-size:32px;
text-align:center;
margin-bottom:10px;
}

h2{
text-align:center;
color:#fff;
margin-bottom:30px;
}
h1{
text-align:center;
color:#ffffff;
font-size:30px;
margin-bottom:5px;
}

.store-name{
text-align:center;
color:#00d4ff;
font-size:16px;
margin-bottom:20px;
}
.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
color:#c9d1d9;
}

input{
width:100%;
padding:14px;
background:#21262d;
border:none;
outline:none;
border-radius:10px;
color:white;
}

input:focus{
border:1px solid #00d4ff;
}

button{
width:100%;
padding:14px;
background:#00bcd4;
border:none;
border-radius:10px;
font-size:17px;
color:white;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#0097a7;
}

#error{
margin-top:15px;
text-align:center;
color:#ff4d4d;
}

.signup{
margin-top:20px;
text-align:center;
color:#c9d1d9;
}

.signup a{
color:#00d4ff;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">🛒</div>
<h1>متجر أنس</h1>
<p class="store-name">Anas Store</p>
<h2>تسجيل الدخول</h2>

<div class="input-group">
<label>البريد الإلكتروني</label>
<input type="email" id="email">
</div>

<div class="input-group">
<label>كلمة المرور</label>
<input type="password" id="password">
</div>

<button id="loginBtn">
تسجيل الدخول
</button>
<a href="#" id="forgotPassword">نسيت كلمة المرور؟</a>
<div id="error"></div>

<div class="signup">
ليس لديك حساب؟
<a href="signup.html">إنشاء حساب</a>
</div>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const loginBtn=document.getElementById("loginBtn");
const error=document.getElementById("error");
document.getElementById("forgotPassword").addEventListener("click", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  if (!email) {
    alert("أدخل بريدك الإلكتروني أولاً.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    alert("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.");
  } catch (error) {
    alert("تعذر إرسال الرابط. تأكد من صحة البريد الإلكتروني.");
  }
});
loginBtn.addEventListener("click",async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

error.innerHTML="";

try{

await signInWithEmailAndPassword(auth,email,password);

window.location.href="index.html";

}catch(e){

error.innerHTML="البريد الإلكتروني أو كلمة المرور غير صحيحة";

}

});

</script>

</body>
</html>
